<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} | Cold Informatica</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

  <div class="portal">

    <aside class="rail" id="rail">
      <div class="rail-top">
        <div class="rail-brand">
          <div class="rail-mark">CA</div>
          <span class="rail-name">Cold Informatica</span>
        </div>
      </div>

      <div class="rail-section">
        <span class="rail-label">Library</span>
        <a href="/" class="rail-link rail-link-active" data-tag="">
          All notes
        </a>
        {% for tag in collections.notes | uniqueTags %}
        <a href="/?tag={{ tag }}" class="rail-link" data-tag="{{ tag }}">
          {{ tag }}
        </a>
        {% endfor %}
      </div>

      <div class="rail-section rail-bottom">
        <span class="rail-label">Account</span>
        <a href="/login/" class="rail-link" id="rail-auth-link">
          Sign in
        </a>
      </div>
    </aside>

    <div class="portal-main">

      <header class="topbar">
        <button class="rail-toggle" id="rail-toggle" aria-label="Toggle sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>

        <div class="search-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="Search notes by title or topic..."
          />
        </div>
      </header>

      <main class="site-content">
        {{ content | safe }}
      </main>

      <footer class="site-footer">
        <div class="site-footer-inner">
          <span>Cold Informatica</span>
          <span>Structured notes on databases &amp; data engineering</span>
        </div>
      </footer>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/auth.js"></script>
  <script src="/assets/portal.js"></script>
</body>
</html>
