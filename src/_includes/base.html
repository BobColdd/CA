<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} | Cold Analytica</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

  <header class="site-header">
    <div class="site-header-inner">
      <div class="brand-group">
        <div class="brand-mark">CA</div>
        <div class="brand-text">
          <a href="/" class="brand">Cold Analytica</a>
          <p class="tagline">Database &amp; Data Engineering Notes</p>
        </div>
      </div>
      <span class="header-badge">Notes Archive</span>
    </div>
  </header>

  <main class="site-content">
    {{ content | safe }}
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <span>Cold Analytica</span>
      <span>Structured notes on databases &amp; data engineering</span>
    </div>
  </footer>

</body>
</html>
