---
layout: base.html
title: Notes Directory
---

<style>
  .notes-page {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 20px;
  }

  .notes-page h1 {
    font-size: 22px;
    font-weight: 600;
    color: #0a1628;
    margin: 0 0 24px;
    padding-bottom: 10px;
    border-bottom: 1px solid #e8edf3;
  }

  .notes-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .notes-list-item {
    padding: 10px 0;
    border-bottom: 1px solid #f0f3f7;
  }

  .notes-list-item:last-child {
    border-bottom: none;
  }

  .notes-list-item a {
    font-size: 16px;
    color: #1a3a6b;
    text-decoration: none;
  }

  .notes-list-item a:hover {
    color: #2c5282;
    text-decoration: underline;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #6a8aaa;
    font-size: 16px;
  }
</style>

<div class="notes-page">
  <h1>Notes Directory</h1>

  <ul class="notes-list">
    {% for note in collections.notes %}
      <li class="notes-list-item">
        <a href="{{ note.url }}">{{ note.data.title }}</a>
      </li>
    {% else %}
      <li class="empty-state">No notes yet. Add a note to the <code>notes/</code> folder.</li>
    {% endfor %}
  </ul>
</div>
